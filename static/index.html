<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Onboarding Assistant</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>

<body>
    <header class="top-bar">
        <div class="header-logo">
            <svg height="32" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="32" fill="currentColor">
                <path
                    d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
                </path>
            </svg>
            <span class="app-name">Repo Onboarding Assistant</span>
        </div>
        <div class="header-search">
            <form id="indexForm">
                <div class="search-input-wrapper">
                    <svg class="search-icon" aria-hidden="true" height="16" viewBox="0 0 16 16" version="1.1" width="16"
                        fill="currentColor">
                        <path
                            d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z">
                        </path>
                    </svg>
                    <input type="text" id="repoUrl" placeholder="Paste repo link" required>
                </div>
                <button type="submit" class="search-submit-btn" id="indexBtn" title="Index Repository">
                    <span>Proceed</span>
                </button>
            </form>
        </div>
        <div class="header-status" id="headerStatus">
            <!-- Status dots / icons appear here -->
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <h3 class="sidebar-title">Files</h3>
            <div id="fileTree" class="file-tree">
                <!-- Tree items injected here -->
            </div>
        </aside>

        <div class="resizer" id="resizer"></div>

        <main class="main-panel">
            <div id="emptyState" class="empty-state">
                <svg class="empty-icon" height="48" viewBox="0 0 16 16" version="1.1" width="48" fill="currentColor">
                    <path
                        d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1v-1h-8a1 1 0 0 0-1 1Zm0-2v-1h-8a1 1 0 0 0-1 1Zm0-2v-1h-8a1 1 0 0 0-1 1Zm0-2v-1h-8a1 1 0 0 0-1 1Z">
                    </path>
                </svg>
                <h2>No repository indexed</h2>
                <p>Enter a GitHub URL in the top bar to begin.</p>
            </div>

            <div id="loadingState" class="empty-state" style="display: none;">
                <div class="loader"></div>
                <h2>Indexing repository...</h2>
            </div>

            <div id="repoContent" style="display: none;">
                <div class="overview-card card">
                    <div class="card-header">
                        <span id="repoNameTitle">Repository Overview</span>
                    </div>
                    <div class="card-body">
                        <p id="overviewText"></p>
                        <div class="language-bar" id="languageBar"></div>
                        <div class="language-legend" id="languageLegend"></div>
                    </div>
                </div>

                <div class="chat-thread" id="chatThread">
                    <!-- Chat messages injected here -->
                </div>

                <div class="chat-input-container">
                    <form id="askForm">
                        <input type="text" id="questionInput" placeholder="Ask a question about this repository..."
                            required autocomplete="off">
                        <button type="submit" class="btn btn-primary" id="askBtn">Ask</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div id="citationPopover" class="popover-container" style="display: none;">
        <div class="popover-header" id="popoverHeader">filename</div>
        <div class="popover-body">
            <pre><code id="popoverContent">loading...</code></pre>
        </div>
    </div>

    <!-- File Viewer Modal -->
    <div id="fileViewerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="fileViewerTitle">filename</h3>
                <span class="close" id="closeFileViewer">&times;</span>
            </div>
            <div class="modal-body">
                <pre><code id="fileViewerContent">loading...</code></pre>
            </div>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>

</html>
