zerops:
  - setup: app
    build:
      base: python@3.12
      deployFiles:
        - ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - python3 -m pip install --break-system-packages --upgrade pip
        - python3 -m pip install --break-system-packages -r requirements.txt
      initCommands:
        - python3 db/setup_extension.py # Sets up pgvector using superuser
        - python3 db/client.py # Initializes the database on deploy
      start: python3 -m uvicorn api.main:app --host 0.0.0.0 --port 8000
      envVariables:
        DATABASE_URL: ${db_connectionString}
        DB_SUPERUSER: ${db_superUser}
        DB_SUPERUSER_PASSWORD: ${db_superUserPassword}
        DB_HOSTNAME: ${db_hostname}
        DB_PORT: ${db_port}
        DB_NAME: ${db_dbName}

  - setup: frontend
    build:
      base: static
      deployFiles:
        - static
    run:
      base: static





